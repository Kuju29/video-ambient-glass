<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ambient-glass demo</title>
<style>
  :root { color-scheme: dark; --bg: #0d0e14; --card: #171923; --line: #2a2d3a; --text: #e8e6df; --muted: #9a98a3; --accent: #ffb547; }
  * { box-sizing: border-box; }
  body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header, .panel { position: relative; z-index: 2; }            /* our own UI sits above the glass (z-index 1) */
  header { max-width: 980px; margin: 0 auto; padding: 28px 20px 0; }
  header h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  header p { margin: 0; color: var(--muted); }
  .stage { display: flex; justify-content: center; padding: 110px 20px; }
  .target { position: relative; width: min(880px, 100%); aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; }
  .target > * { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; object-fit: cover; }
  .anim { background: linear-gradient(120deg, #ff3b30, #ffd60a, #30d158, #0a84ff, #bf5af2, #ff3b30); background-size: 400% 400%; animation: move 8s linear infinite; }
  .anim::after { content: ""; position: absolute; width: 22%; aspect-ratio: 1; top: 30%; background: #fff; border-radius: 50%; animation: ball 4s ease-in-out infinite alternate; }
  @keyframes move { to { background-position: 400% 0; } }
  @keyframes ball { from { left: 2%; } to { left: 76%; } }
  .panel { max-width: 980px; margin: 0 auto 60px; padding: 18px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  button, .file { background: #232633; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #241500; border-color: var(--accent); }
  .file input { display: none; }
  input[type="text"] { flex: 1; min-width: 200px; background: #0f1118; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 24px; }
  label { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 13px; color: var(--muted); }
  label input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  label output { color: var(--text); font-variant-numeric: tabular-nums; }
  .checks label { display: inline-flex; gap: 6px; align-items: center; margin-right: 18px; color: var(--text); }
  code { background: #0f1118; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 13px; }
  pre { margin: 0; background: #0f1118; border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: auto; font-size: 13px; color: #cfd3e0; }
  .outline { position: absolute; pointer-events: none; z-index: 3; border: 1px dashed; border-radius: 4px; }
  .outline span { position: absolute; top: 4px; left: 8px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>ambient-glass</h1>
  <p>Ambient light around any picture — CSS animation, &lt;video&gt;, YouTube or any iframe — without reading or copying it.</p>
</header>

<div class="stage" id="stage">
  <div class="target" id="target"></div>
</div>

<div class="panel">
  <div class="row" role="group" aria-label="Source">
    <button data-src="anim" aria-pressed="true">CSS animation</button>
    <button data-src="video" aria-pressed="false">&lt;video&gt;</button>
    <button data-src="iframe" aria-pressed="false">iframe</button>
    <button data-src="youtube" aria-pressed="false">YouTube</button>
    <label class="file">Your own video file<input type="file" id="file" accept="video/*"></label>
  </div>
  <div class="row">
    <input type="text" id="yt" placeholder="YouTube link or video id, then Enter" aria-label="YouTube link or id">
  </div>
  <div class="row checks">
    <label><input type="checkbox" id="on" checked> Glow on</label>
    <label><input type="checkbox" id="corners" checked> Corner layer</label>
    <label><input type="checkbox" id="debug"> Show the glass boxes</label>
  </div>
  <div class="grid" id="sliders"></div>
  <div class="row" style="margin-top:16px"><pre id="code"></pre></div>
</div>

<script src="../ambient-glass.js"></script>
<script>
  var target = document.getElementById("target"), stage = document.getElementById("stage");
  var S = { nearPad: 220, nearBlur: 40, nearBright: 1.45, farPad: 480, farBlur: 110, farBright: 1.25, cornerBright: 1.5 };
  var SL = [
    ["nearPad", "Near glass: reach (px)", 40, 400, 10], ["nearBlur", "Near glass: blur (px)", 0, 120, 2], ["nearBright", "Near glass: brightness", 1, 2.5, 0.05],
    ["farPad", "Far glass: reach (px)", 0, 800, 10], ["farBlur", "Far glass: blur (px)", 0, 240, 5], ["farBright", "Far glass: brightness", 1, 2, 0.05],
    ["cornerBright", "Corner layer: brightness", 1, 2.5, 0.05]
  ];
  var contrastFor = function (b) { return +(0.45 / (0.5 - 0.05 * b)).toFixed(3); };   // keeps ~5 % black as it is

  function settings() {
    var layers = [{ pad: S.nearPad, filter: "blur(" + S.nearBlur + "px) saturate(1.3) brightness(" + S.nearBright + ")" }];
    if (S.farPad > 0) layers.push({ pad: S.farPad, filter: "blur(" + S.farBlur + "px) brightness(" + S.farBright + ")" });
    var corners = document.getElementById("corners").checked
      ? { filter: "brightness(" + S.cornerBright + ") contrast(" + contrastFor(S.cornerBright) + ")" } : null;
    return { layers: layers, corners: corners, small: null };
  }

  var glow = AmbientGlass.attach(target, Object.assign({ container: stage }, settings()));

  function showCode() {
    var s = settings();
    document.getElementById("code").textContent =
      'AmbientGlass.attach(document.querySelector("#player"), {\n  layers: [\n' +
      s.layers.map(function (l) { return '    { pad: ' + l.pad + ', filter: "' + l.filter + '" }'; }).join(",\n") +
      '\n  ],\n  corners: ' + (s.corners ? '{ filter: "' + s.corners.filter + '" }' : "null") + "\n});";
  }

  // sliders
  var box = document.getElementById("sliders");
  SL.forEach(function (d) {
    var l = document.createElement("label");
    l.innerHTML = d[1] + '<output id="o-' + d[0] + '">' + S[d[0]] + '</output><input type="range" min="' + d[2] + '" max="' + d[3] + '" step="' + d[4] + '" value="' + S[d[0]] + '">';
    l.querySelector("input").addEventListener("input", function (e) {
      S[d[0]] = +e.target.value; document.getElementById("o-" + d[0]).textContent = e.target.value;
      glow.set(settings()); showCode(); outlines();
    });
    box.appendChild(l);
  });
  document.getElementById("corners").addEventListener("change", function () { glow.set(settings()); showCode(); outlines(); });
  document.getElementById("on").addEventListener("change", function (e) { glow.enable(e.target.checked); });

  // sources: the glow does not care what the picture is
  var current = null;
  function source(kind, arg) {
    document.querySelectorAll("[data-src]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.src === kind)); });
    target.innerHTML = "";
    var el;
    if (kind === "anim") { el = document.createElement("div"); el.className = "anim"; }
    if (kind === "video") {
      el = document.createElement("video");
      el.src = arg || "sample.mp4"; el.muted = true; el.loop = true; el.autoplay = true; el.playsInline = true; el.controls = true;
    }
    if (kind === "iframe") { el = document.createElement("iframe"); el.src = "frame.html"; el.title = "Any web page"; }
    if (kind === "youtube") {
      el = document.createElement("iframe");
      el.src = "https://www.youtube.com/embed/" + encodeURIComponent(arg || "aqz-KE-bpKQ") + "?rel=0&playsinline=1";
      el.title = "YouTube video"; el.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; el.allowFullscreen = true;
      el.referrerPolicy = "strict-origin-when-cross-origin";      // YouTube needs to know the page it is on
    }
    target.appendChild(el);
    if (current && current.startsWith("blob:") && current !== arg) URL.revokeObjectURL(current);
    current = arg || "";
    glow.update(); outlines();
  }
  document.querySelectorAll("[data-src]").forEach(function (b) { b.addEventListener("click", function () { source(b.dataset.src); }); });
  document.getElementById("file").addEventListener("change", function (e) {
    var f = e.target.files[0]; if (f) source("video", URL.createObjectURL(f));
  });
  document.getElementById("yt").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var v = e.target.value.trim(), m = v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
    source("youtube", m ? m[1] : v);
  });

  // "show the glass boxes": dashed outlines where each glass and the hole are (the glass itself is invisible at its edges)
  var COLORS = ["#7fc7ff", "#b49cff", "#ffb547"];
  function outlines() {
    stage.querySelectorAll(".outline").forEach(function (o) { o.remove(); });
    if (!document.getElementById("debug").checked) return;
    var names = ["near glass", "far glass", "corner layer"];
    glow.layers.forEach(function (g, i) {
      var o = document.createElement("div");
      o.className = "outline";
      o.style.cssText += ";left:" + g.style.left + ";top:" + g.style.top + ";width:" + g.style.width + ";height:" + g.style.height + ";border-color:" + COLORS[i % 3] + ";color:" + COLORS[i % 3];
      var label = settings().layers.length === 1 && i === 1 ? names[2] : names[i];
      o.innerHTML = "<span>" + label + "</span>";
      stage.appendChild(o);
    });
    var r = target.getBoundingClientRect(), c = stage.getBoundingClientRect(), h = document.createElement("div");
    h.className = "outline";
    h.style.cssText += ";left:" + (r.left - c.left) + "px;top:" + (r.top - c.top) + "px;width:" + r.width + "px;height:" + r.height + "px;border-color:#fff;color:#fff;border-radius:14px";
    h.innerHTML = "<span>hole = the target</span>";
    stage.appendChild(h);
  }
  document.getElementById("debug").addEventListener("change", outlines);
  addEventListener("resize", function () { requestAnimationFrame(outlines); });

  source("anim");
  showCode();
</script>
</body>
</html>
