<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="300" fill="#0D0E14"/>
<text x="380" y="26" fill="#e8e6df" font-size="15" text-anchor="middle" font-weight="600">Why corners come out darker, and the corner layer</text>
<rect x="60" y="120" width="160" height="140" fill="#6f5a48"/><rect x="60" y="60" width="160" height="60" fill="#1c1e28"/>
<circle cx="140" cy="120" r="55" fill="none" stroke="#f0c48a" stroke-width="2"/><circle cx="140" cy="120" r="3" fill="#f0c48a"/>
<text x="140" y="285" fill="#f0c48a" font-size="12" text-anchor="middle">beside an edge: blur finds 1/2 picture</text>
<rect x="320" y="120" width="140" height="140" fill="#6f5a48"/><rect x="290" y="60" width="200" height="60" fill="#1c1e28"/><rect x="460" y="120" width="30" height="140" fill="#1c1e28"/>
<circle cx="460" cy="120" r="55" fill="none" stroke="#f0997b" stroke-width="2"/><circle cx="460" cy="120" r="3" fill="#f0997b"/>
<text x="400" y="285" fill="#f0997b" font-size="12" text-anchor="middle">past a corner: only 1/4 picture</text>
<rect x="560" y="120" width="120" height="140" fill="#6f5a48"/>
<path d="M680 120 L740 120 L740 60 L680 60 Z" fill="#f0c48a" opacity=".35"/>
<text x="710" y="94" fill="#9fe1cb" font-size="11" text-anchor="middle">x1.5</text>
<text x="640" y="285" fill="#9fe1cb" font-size="12" text-anchor="middle">corner layer brightens only here</text>
</svg>
