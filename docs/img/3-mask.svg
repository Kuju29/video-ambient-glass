<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="420" fill="#0D0E14"/>
<text x="380" y="26" fill="#e8e6df" font-size="15" text-anchor="middle" font-weight="600">Front view: one glass box and its mask</text>
<rect x="60" y="50" width="640" height="320" fill="none" stroke="#8fb6d9" stroke-dasharray="4 4"/>
<text x="70" y="66" fill="#8fb6d9" font-size="11">glass box = target + pad on every side</text>
<rect x="110" y="90" width="540" height="240" rx="90" fill="#8fb6d9" opacity=".18"/>
<rect x="140" y="110" width="480" height="200" rx="70" fill="#8fb6d9" opacity=".18"/>
<rect x="230" y="150" width="300" height="120" rx="12" fill="#0D0E14" stroke="#e8e6df" stroke-dasharray="5 4"/>
<text x="380" y="205" fill="#e8e6df" font-size="13" text-anchor="middle">hole = the target's shape</text>
<text x="380" y="225" fill="#aaa" font-size="11" text-anchor="middle">same corner radius (radius: "auto")</text>
<line x1="230" y1="300" x2="60" y2="300" stroke="#f0c48a"/><text x="145" y="294" fill="#f0c48a" font-size="11" text-anchor="middle">pad</text>
<text x="380" y="395" fill="#e8e6df" font-size="12" text-anchor="middle">Fade: a blurred rounded box, inset 0.55 x pad, blur 0.18 x pad, corner radius = pad - inset + hole radius</text>
<text x="380" y="412" fill="#aaa" font-size="11" text-anchor="middle">~99 % at the target, half way at 45 % of pad, ~0.1 % at the glass edge</text>
</svg>
