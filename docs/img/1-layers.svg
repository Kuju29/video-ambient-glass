<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="360" fill="#0D0E14"/>
<text x="380" y="28" fill="#e8e6df" font-size="15" text-anchor="middle" font-weight="600">Side view: what is stacked on the page</text>
<g font-size="12">
<circle cx="380" cy="60" r="12" fill="none" stroke="#e8e6df"/><circle cx="380" cy="60" r="4" fill="#e8e6df"/><text x="400" y="64" fill="#e8e6df">viewer</text>
<text x="40" y="88" fill="#9fe1cb">5. your controls (z-index 2) — always sharp, above the glass</text>
<rect x="60" y="120" width="190" height="20" fill="#8fb6d9" opacity=".25"/><rect x="510" y="120" width="190" height="20" fill="#8fb6d9" opacity=".25"/>
<text x="60" y="114" fill="#cfe3f5">4. far glass: reach 480 px, blur 110 px — blurs the near light again</text>
<rect x="90" y="172" width="160" height="20" fill="#8fb6d9" opacity=".45"/><rect x="510" y="172" width="160" height="20" fill="#8fb6d9" opacity=".45"/>
<text x="90" y="166" fill="#cfe3f5">3. near glass: reach 220 px, blur 40 px</text>
<rect x="250" y="172" width="260" height="20" fill="none" stroke="#8fb6d9" stroke-dasharray="5 4"/>
<text x="380" y="186" fill="#8fb6d9" text-anchor="middle">hole (mask) — no glass seen here</text>
<rect x="250" y="232" width="260" height="30" fill="#6f5a48" stroke="#e8e6df"/><text x="380" y="252" fill="#fff" text-anchor="middle">2. the target: video / iframe / canvas</text>
<path d="M300 232 L200 196" stroke="#f0c48a" stroke-width="1.5" fill="none"/><path d="M460 232 L560 196" stroke="#f0c48a" stroke-width="1.5" fill="none"/>
<text x="380" y="280" fill="#f0c48a" text-anchor="middle">its edge light is blurred outwards</text>
<rect x="60" y="292" width="640" height="26" fill="#1c1e28"/><text x="80" y="309" fill="#aaa">1. page background</text>
<text x="380" y="345" fill="#e8e6df" text-anchor="middle">Every glass box covers the target too — that is where its light comes from. The mask only hides the middle.</text>
</g>
</svg>
