<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="330" fill="#0D0E14"/>
<text x="380" y="26" fill="#e8e6df" font-size="15" text-anchor="middle" font-weight="600">Cross-section at the left edge: brightness by position</text>
<line x1="60" y1="260" x2="720" y2="260" stroke="#666"/><line x1="60" y1="60" x2="60" y2="260" stroke="#666"/>
<rect x="470" y="60" width="250" height="200" fill="#6f5a48" opacity=".35"/><text x="595" y="80" fill="#e8e6df" font-size="12" text-anchor="middle">inside the target (the hole)</text>
<path d="M60 258 L300 258 C380 258 420 120 470 100 L720 100" fill="none" stroke="#888" stroke-dasharray="5 4" stroke-width="1.5"/>
<path d="M60 258 C200 256 330 225 400 170 C440 140 460 120 470 112" fill="none" stroke="#f0c48a" stroke-width="2.5"/>
<path d="M90 258 C230 257 320 245 380 210 C420 185 450 160 470 150" fill="none" stroke="#9fe1cb" stroke-width="2"/>
<line x1="80" y1="72" x2="110" y2="72" stroke="#888" stroke-dasharray="5 4" stroke-width="1.5"/><text x="118" y="76" fill="#aaa" font-size="12">no glass: dark right outside the edge</text>
<line x1="80" y1="96" x2="110" y2="96" stroke="#f0c48a" stroke-width="2.5"/><text x="118" y="100" fill="#f0c48a" font-size="12">blurred: the edge colour flows outwards</text>
<line x1="80" y1="120" x2="110" y2="120" stroke="#9fe1cb" stroke-width="2"/><text x="118" y="124" fill="#9fe1cb" font-size="12">x fading mask: ~0 at the glass edge, no line</text>
<text x="60" y="282" fill="#aaa" font-size="11">glass edge</text><text x="470" y="282" fill="#aaa" font-size="11" text-anchor="middle">target edge</text><text x="720" y="282" fill="#aaa" font-size="11" text-anchor="end">centre</text>
<text x="380" y="312" fill="#e8e6df" font-size="12" text-anchor="middle">Red on the left edge of the picture becomes red light on the left: same side, never mirrored.</text>
</svg>
